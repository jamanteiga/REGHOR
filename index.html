<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Tareas</title>
  <!-- Tailwind CSS para estilos rápidos y limpios -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js para los gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <h1 class="text-3xl font-bold text-gray-800">Panel de Registro de Tareas</h1>

    <!-- Formulario de Entrada -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4">Nueva Tarea</h2>
      <form id="task-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Fecha</label>
          <input type="date" id="fecha" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Categoría / Proyecto</label>
          <input type="text" id="categoria" placeholder="Ej. Cliente X, Interno..." required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700">Descripción de la Tarea</label>
          <input type="text" id="descripcion" placeholder="¿Qué has hecho?" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Horas Invertidas</label>
          <input type="number" step="0.5" id="horas" placeholder="1.5" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 font-medium">Guardar Tarea</button>
        </div>
      </form>
    </div>

    <!-- Sección de Gráficos -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4">Horas por Categoría</h2>
      <div class="w-full max-w-md mx-auto">
        <canvas id="myChart"></canvas>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
