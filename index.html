<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGHOR - Registro de Tareas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Encabezado -->
    <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
      <h1 class="text-2xl font-bold text-gray-800">REGHOR - Registro de Horas y Tareas</h1>
    </div>

    <!-- Formulario de Entrada (Fila Única) -->
    <div class="bg-white p-4 rounded-lg shadow-md overflow-x-auto">
      <h2 class="text-lg font-semibold mb-3 text-gray-700">Nueva Tarea</h2>
      
      <form id="task-form" class="flex flex-nowrap items-end gap-3 min-w-[1200px]">
        
        <!-- 1. Fecha -->
        <div class="w-36 flex-shrink-0">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fecha</label>
          <input type="date" id="fecha" required class="w-full border border-gray-300 rounded p-2 text-sm">
        </div>

        <!-- 2. Tarea -->
        <div class="w-48 flex-shrink-0">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tarea</label>
          <input type="text" id="tarea" placeholder="Ej. Revisión código" required class="w-full border border-gray-300 rounded p-2 text-sm">
        </div>

        <!-- 3. Proyecto (Desplegable) -->
        <div class="w-32 flex-shrink-0">
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-semibold text-gray-600 uppercase">Proyecto</label>
            <button type="button" id="btn-gestionar-proyectos" class="text-[10px] text-blue-600 hover:underline">+ Config</button>
          </div>
          <select id="proyecto" required class="w-full border border-gray-300 rounded p-2 text-sm bg-white">
            <!-- Se carga dinámicamente desde JS -->
          </select>
        </div>

        <!-- 4. Bloque -->
        <div class="w-32 flex-shrink-0">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Bloque</label>
          <input type="text" id="bloque" placeholder="Ej. Bloque 1" class="w-full border border-gray-300 rounded p-2 text-sm">
        </div>

        <!-- 5. Hora Inicio -->
        <div class="w-32 flex-shrink-0">
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-semibold text-gray-600 uppercase">H. Inicio</label>
            <button type="button" id="btn-usar-ultima-fin" class="text-[10px] bg-gray-200 hover:bg-gray-300 text-gray-700 px-1 rounded" title="Usar hora fin de la última tarea registrado">⬅ Copiar</button>
          </div>
          <input type="time" id="hora-inicio" required class="w-full border border-gray-300 rounded p-2 text-sm">
        </div>

        <!-- 6. Hora Fin -->
        <div class="w-36 flex-shrink-0">
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-semibold text-gray-600 uppercase">H. Fin</label>
            <button type="button" id="btn-hora-actual" class="text-[10px] bg-blue-100 hover:bg-blue-200 text-blue-700 px-1 rounded" title="Poner hora actual">⏱ Ahora</button>
          </div>
          <input type="time" id="hora-fin" class="w-full border border-gray-300 rounded p-2 text-sm">
        </div>

        <!-- 7. Duración (Calculado automáticamente) -->
        <div class="w-24 flex-shrink-0">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Duración</label>
          <input type="text" id="duracion" readonly placeholder="00:00" class="w-full bg-gray-100 border border-gray-300 rounded p-2 text-sm font-bold text-gray-700 text-center">
        </div>

        <!-- 8. Comentario -->
        <div class="flex-1 min-w-[200px]">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Comentario</label>
          <input type="text" id="comentario" placeholder="Explicación breve..." class="w-full border border-gray-300 rounded p-2 text-sm">
        </div>

        <!-- 9. Notas -->
        <div class="flex-1 min-w-[180px]">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Notas</label>
          <input type="text" id="notas" placeholder="Detalles o anotaciones..." class="w-full border border-gray-300 rounded p-2 text-sm">
        </div>

        <!-- Botón de Guardado -->
        <div class="w-28 flex-shrink-0">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-2 rounded text-sm transition-colors">
            + Guardar
          </button>
        </div>

      </form>
    </div>

    <!-- Modal Gestión de Proyectos -->
    <div id="modal-proyectos" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center p-4">
      <div class="bg-white rounded-lg p-5 max-w-sm w-full space-y-4">
        <h3 class="text-lg font-bold">Gestionar Lista de Proyectos</h3>
        <div class="flex gap-2">
          <input type="text" id="nuevo-proyecto-input" placeholder="NUEVO_CODIGO" class="border p-2 rounded text-sm flex-1 uppercase">
          <button id="btn-add-proyecto" class="bg-green-600 text-white px-3 py-1 rounded text-sm font-semibold">+ Añadir</button>
        </div>
        <ul id="lista-proyectos-gestor" class="max-h-48 overflow-y-auto border rounded divide-y text-sm"></ul>
        <div class="text-right">
          <button id="btn-cerrar-modal" class="bg-gray-500 text-white px-4 py-1.5 rounded text-sm">Cerrar</button>
        </div>
      </div>
    </div>

    <!-- Tabla de Registros del Día / Recientes -->
    <div class="bg-white p-4 rounded-lg shadow-md overflow-x-auto">
      <h2 class="text-lg font-semibold mb-3 text-gray-700">Registros de Hoy</h2>
      <table class="w-full text-left text-sm border-collapse">
        <thead>
          <tr class="bg-gray-100 text-gray-600 border-b">
            <th class="p-2">Fecha</th>
            <th class="p-2">Tarea</th>
            <th class="p-2">Proyecto</th>
            <th class="p-2">Bloque</th>
            <th class="p-2">Inicio</th>
            <th class="p-2">Fin</th>
            <th class="p-2">Duración</th>
            <th class="p-2">Comentario</th>
            <th class="p-2">Notas</th>
          </tr>
        </thead>
        <tbody id="tabla-registros" class="divide-y">
          <!-- Se rellena automáticamente -->
        </tbody>
      </table>
    </div>

    <!-- Panel de Gráficos -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Resumen de Horas por Proyecto</h2>
      <div class="w-full max-w-md mx-auto">
        <canvas id="myChart"></canvas>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
