<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGHOR - Registro de Horas</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --text-color: #333333;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
      --header-bg: #00bfff;
      --header-text: #ffffff;
      --btn-primary: #007bff;
      --btn-success: #28a745;
      --btn-warning: #ffc107;
      --btn-danger: #dc3545;
    }

    body.dark-mode {
      --bg-color: #1e1e2e;
      --text-color: #e0e0e0;
      --card-bg: #2a2a3c;
      --border-color: #444456;
      --header-bg: #0f4c81;
      --header-text: #ffffff;
      --btn-primary: #3b82f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      color: var(--text-color);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
    }

    input, select, textarea {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 0.9rem;
    }

    .input-with-btn {
      display: flex;
      gap: 5px;
    }

    .input-with-btn input {
      flex: 1;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-primary { background-color: var(--btn-primary); color: white; }
    .btn-success { background-color: var(--btn-success); color: white; }
    .btn-warning { background-color: var(--btn-warning); color: black; }
    .btn-danger { background-color: var(--btn-danger); color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-mini { padding: 4px 8px; font-size: 0.75rem; }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.88rem;
    }

    th {
      background-color: var(--header-bg);
      color: var(--header-text);
      font-weight: 600;
    }

    .resumen-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      margin-top: 20px;
      font-size: 0.95rem;
    }

    .resumen-row {
      display: flex;
      gap: 15px;
      width: 300px;
      justify-content: space-between;
    }

    .saldo-positivo { color: #28a745; font-weight: bold; }
    .saldo-negativo { color: #dc3545; font-weight: bold; }
    .saldo-neutro { color: #6c757d; font-weight: bold; }

    /* Dropdown gráfico */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: var(--card-bg);
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .dropdown-content a {
      color: var(--text-color);
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      font-size: 0.85rem;
    }

    .dropdown-content a:hover {
      background-color: var(--border-color);
    }

    .show { display: block; }

    /* Modal Configuración */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 400px;
      max-width: 90%;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-body ul {
      list-style: none;
      padding: 0;
      max-height: 250px;
      overflow-y: auto;
    }
  </style>
  <!-- CDN Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="txt-titulo">REGHOR</h1>
      <div class="header-actions">
        <button id="btn-theme" onclick="toggleTheme()" class="btn-secondary">🌙 Oscuro</button>
        <button onclick="cambiarIdioma('es')" class="btn-mini">ES</button>
        <button onclick="cambiarIdioma('gl')" class="btn-mini">GL</button>
        <div class="dropdown">
          <button id="btn-graficos" onclick="toggleDropdownGraficos(event)" class="btn-primary">📊 Gráficos ▾</button>
          <div id="dropdown-graficos-container" class="dropdown-content">
            <a href="#" onclick="filtrarGrafico('Día')">Por Día</a>
            <a href="#" onclick="filtrarGrafico('Semana')">Por Semana</a>
            <a href="#" onclick="filtrarGrafico('Mes')">Por Mes</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Formulario de Registro -->
    <div class="card">
      <form id="tarea-form">
        <input type="hidden" id="tarea-id">
        <div class="form-grid">
          
          <div class="form-group">
            <label id="lbl-fecha" for="fecha">Fecha</label>
            <input type="date" id="fecha" required>
          </div>

          <div class="form-group">
            <div style="display:flex; justify-content:space-between;">
              <label id="lbl-tarea" for="tarea">Tarea</label>
              <a href="#" onclick="abrirConfig('tareas')" style="font-size:0.75rem;">+config</a>
            </div>
            <select id="tarea" onchange="sincronizarComentario()"></select>
          </div>

          <div class="form-group">
            <div style="display:flex; justify-content:space-between;">
              <label id="lbl-proyecto" for="proyecto">Proyecto</label>
              <a href="#" onclick="abrirConfig('proyectos')" style="font-size:0.75rem;">+config</a>
            </div>
            <select id="proyecto"></select>
          </div>

          <div class="form-group">
            <label for="bloque">Bloque</label>
            <input type="text" id="bloque" placeholder="Ej: B242-PI-SB4">
          </div>

          <div class="form-group">
            <label for="horainicio">Inicio</label>
            <div class="input-with-btn">
              <input type="time" id="horainicio" required>
              <button type="button" class="btn-secondary btn-mini" onclick="copiarHoraFinAnterior()" title="Copiar última hora fin">📋</button>
              <button type="button" class="btn-secondary btn-mini" onclick="setHoraActual('horainicio')" title="Hora actual">🕒</button>
            </div>
          </div>

          <div class="form-group">
            <label for="horafin">Fin</label>
            <div class="input-with-btn">
              <input type="time" id="horafin" required>
              <button type="button" class="btn-secondary btn-mini" onclick="setHoraActual('horafin')" title="Hora actual">🕒</button>
            </div>
          </div>

          <div class="form-group">
            <label for="comentario">Comentario</label>
            <input type="text" id="comentario">
          </div>

          <div class="form-group">
            <label for="notas">Notas</label>
            <input type="text" id="notas">
          </div>

        </div>

        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" id="btn-cancelar" class="btn-secondary" style="display:none;" onclick="resetearFormulario()">Cancelar</button>
          <button type="submit" id="btn-guardar" class="btn-success">Guardar</button>
        </div>
      </form>
    </div>

    <!-- Listado de Tareas -->
    <div class="card">
      <h2 id="txt-listado" style="margin-top:0;">Listado de Tareas</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th id="th-fecha">Fecha</th>
              <th id="th-tarea">Tarea</th>
              <th id="th-proyecto">Proyecto</th>
              <th>Bloque</th>
              <th>Inicio</th>
              <th>Fin</th>
              <th>Duración</th>
              <th>Comentario</th>
              <th>Notas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr><td colspan="10">Cargando datos...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Resumen de Horas -->
      <div class="resumen-container">
        <div class="resumen-row">
          <span id="txt-teorica-label">Jornada Teórica del Día:</span>
          <span id="total-teorica">00:00</span>
        </div>
        <div class="resumen-row">
          <span id="txt-total-label">Total Horas Trabajadas:</span>
          <strong id="total-duracion">00:00</strong>
        </div>
        <div class="resumen-row">
          <span id="txt-balance-label">Balance / Horas Extra:</span>
          <span id="total-balance" class="saldo-neutro">00:00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Configuración Tareas/Proyectos -->
  <div id="modal-config" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-titulo" style="margin:0;">Configurar</h3>
        <button type="button" class="btn-mini btn-danger" onclick="cerrarConfig()">X</button>
      </div>
      <div class="modal-body">
        <div class="input-with-btn" style="margin-bottom:15px;">
          <input type="text" id="nuevo-valor-config" placeholder="Nuevo elemento...">
          <button type="button" class="btn-success btn-mini" onclick="agregarOpcionConfig()">Añadir</button>
        </div>
        <ul id="lista-config"></ul>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
