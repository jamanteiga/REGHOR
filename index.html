<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-100 transition-colors duration-200" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGHOR - Registro de Tareas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="w-full min-h-full p-4 font-sans text-gray-800 dark:bg-gray-900 dark:text-gray-100 box-border transition-colors duration-200">
  <div class="w-full space-y-4">
    
    <!-- Encabezado con Idiomas, Modo Oscuro y Menú de Gráficos -->
    <div class="w-full flex flex-wrap justify-between items-center bg-white dark:bg-gray-800 p-3 rounded-lg shadow-sm gap-2">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold text-gray-800 dark:text-white">REGHOR</h1>
        
        <!-- Banderas de Idioma -->
        <div class="flex items-center gap-2 border-l pl-3 border-gray-300 dark:border-gray-700">
          <!-- Bandera España -->
          <button id="btn-lang-es" title="Español" class="hover:scale-110 transition-transform focus:outline-none">
            <img src="https://flagcdn.com/w40/es.png" alt="Español" class="w-6 h-4 rounded shadow-sm object-cover">
          </button>
          <!-- Bandera Galicia -->
          <button id="btn-lang-gl" title="Galego" class="hover:scale-110 transition-transform focus:outline-none">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/Flag_of_Galicia.svg/40px-Flag_of_Galicia.svg.png" alt="Galego" class="w-6 h-4 rounded shadow-sm border border-gray-200 object-cover">
          </button>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- Botón Modo Oscuro / Claro -->
        <button id="btn-dark-mode" type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700 text-xs font-semibold text-gray-800 dark:text-gray-100 hover:bg-gray-200 dark:hover:bg-gray-600 shadow-sm transition-colors cursor-pointer">
          <span id="icon-dark-mode">🌙</span>
          <span id="txt-dark-mode">Modo Oscuro</span>
        </button>

        <!-- Menú Desplegable Gráficos -->
        <div class="relative inline-block text-left">
          <button id="btn-menu-graficos" type="button" class="inline-flex justify-center w-full rounded-md border border-gray-300 dark:border-gray-600 shadow-sm px-3 py-1.5 bg-white dark:bg-gray-700 text-xs font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
            📊 <span id="txt-menu-graficos">Gráficos</span> ▾
          </button>

          <div id="dropdown-menu-graficos" class="hidden origin-top-right absolute right-0 mt-2 w-52 rounded-md shadow-lg bg-white dark:bg-gray-800 ring-1 ring-black ring-opacity-5 z-50 border border-gray-100 dark:border-gray-700">
            <div class="py-1">
              <button id="opcion-por-proyecto" class="w-full text-left px-4 py-2 text-xs text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" data-i18n="grafProyecto">Por proyecto</button>
              <button id="opcion-por-proyecto-bloque" class="w-full text-left px-4 py-2 text-xs text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" data-i18n="grafProyectoBloque">Por Proyecto-Bloque</button>
              <button id="opcion-por-tarea" class="w-full text-left px-4 py-2 text-xs text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" data-i18n="grafTarea">Por Tareas</button>
              <button id="opcion-evolucion" class="w-full text-left px-4 py-2 text-xs text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700" data-i18n="grafEvolucion">Evolución por Fecha (Barras)</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario de Entrada -->
    <div class="w-full bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md">
      <h2 id="lbl-nueva-tarea" class="text-base font-semibold mb-3 text-gray-700 dark:text-gray-200">Nueva Tarea</h2>
      
      <form id="task-form" class="w-full flex flex-wrap lg:flex-nowrap items-end gap-2" novalidate>
        <input type="hidden" id="edit-index" value="-1">

        <!-- Fecha -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[130px]">
          <label id="lbl-fecha" class="block text-[11px] font-semibold text-gray-600 dark:text-gray-400 uppercase mb-1">Fecha</label>
          <input type="date" id="fecha" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1.5 text-xs">
        </div>

        <!-- Tarea -->
        <div class="w-full sm:w-auto sm:flex-[2] min-w-[160px]">
          <div class="flex justify-between items-center mb-1">
            <label id="lbl-tarea" class="text-[11px] font-semibold text-gray-600 dark:text-gray-400 uppercase">Tarea</label>
            <button type="button" id="btn-gestionar-tareas" class="text-[10px] text-blue-600 dark:text-blue-400 hover:underline">+ Config</button>
          </div>
          <select id="tarea" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1.5 text-xs bg-white"></select>
        </div>

        <!-- Proyecto -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[110px]">
          <div class="flex justify-between items-center mb-1">
            <label id="lbl-proyecto" class="text-[11px] font-semibold text-gray-600 dark:text-gray-400 uppercase">Proyecto</label>
            <button type="button" id="btn-gestionar-proyectos" class="text-[10px] text-blue-600 dark:text-blue-400 hover:underline">+ Config</button>
          </div>
          <select id="proyecto" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1.5 text-xs bg-white">
            <option value="BAC2" selected>BAC2</option>
          </select>
        </div>

        <!-- Bloque -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[100px]">
          <label id="lbl-bloque" class="block text-[11px] font-semibold text-gray-600 dark:text-gray-400 uppercase mb-1">Bloque</label>
          <input type="text" id="bloque" placeholder="Bloque 1" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1.5 text-xs">
        </div>

        <!-- Hora Inicio -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[110px]">
          <div class="flex justify-between items-center mb-1">
            <label id="lbl-hinicio" class="text-[11px] font-semibold text-gray-600 dark:text-gray-400 uppercase">H. Inicio</label>
            <button type="button" id="btn-usar-ultima-fin" class="text-[9px] bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 text-gray-700 dark:text-gray-200 px-1 rounded" title="Usar última hora fin">⬅ Copiar</button>
          </div>
          <input type="time" id="hora-inicio" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1.5 text-xs">
        </div>

        <!-- Hora Fin -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[110px]">
          <div class="flex justify-between items-center mb-1">
            <label id="lbl-hfin" class="text-[11px] font-semibold text-gray-600 dark:text-gray-400 uppercase">H. Fin</label>
            <button type="button" id="btn-hora-actual" class="text-[9px] bg-blue-100 dark:bg-blue-900 hover:bg-blue-200 text-blue-700 dark:text-blue-200 px-1 rounded">⏱ Ahora</button>
          </div>
          <input type="time" id="hora-fin" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1.5 text-xs">
        </div>

        <!-- Comentario -->
        <div class="w-full sm:w-auto sm:flex-[3] min-w-[160px]">
          <label id="lbl-comentario" class="block text-[11px] font-semibold text-gray-600 dark:text-gray-400 uppercase mb-1">Comentario</label>
          <input type="text" id="comentario" placeholder="Explicación breve..." class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1.5 text-xs">
        </div>

        <!-- Notas -->
        <div class="w-full sm:w-auto sm:flex-[2] min-w-[140px]">
          <label id="lbl-notas" class="block text-[11px] font-semibold text-gray-600 dark:text-gray-400 uppercase mb-1">Notas</label>
          <input type="text" id="notas" placeholder="Anotaciones..." class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1.5 text-xs">
        </div>

        <!-- Duración -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[80px]">
          <label id="lbl-duracion" class="block text-[11px] font-semibold text-gray-600 dark:text-gray-400 uppercase mb-1">Duración</label>
          <input type="text" id="duracion" readonly placeholder="00:00" class="w-full bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded p-1.5 text-xs font-bold text-gray-700 dark:text-gray-200 text-center">
        </div>

        <!-- Botón Guardar / Cancelar -->
        <div class="w-full sm:w-auto sm:flex-1 min-w-[120px] flex gap-1">
          <button type="submit" id="btn-guardar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-1.5 rounded text-xs transition-colors">
            + Guardar
          </button>
          <button type="button" id="btn-cancelar-edit" class="hidden bg-gray-500 hover:bg-gray-600 text-white font-semibold p-1.5 rounded text-xs">
            ✕
          </button>
        </div>
      </form>
    </div>

    <!-- Modal Gestión (Proyectos y Tareas) -->
    <div id="modal-config" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center p-4 z-50">
      <div class="bg-white dark:bg-gray-800 rounded-lg p-5 max-w-md w-full space-y-4">
        <h3 id="modal-titulo" class="text-lg font-bold dark:text-white">Gestionar Lista</h3>
        <div class="flex gap-2">
          <input type="text" id="nuevo-item-input" placeholder="Añadir nuevo..." class="border dark:border-gray-600 dark:bg-gray-700 dark:text-white p-2 rounded text-sm flex-1">
          <button id="btn-add-item" class="bg-green-600 text-white px-3 py-1 rounded text-sm font-semibold">+ Añadir</button>
        </div>
        <ul id="lista-gestor" class="max-h-48 overflow-y-auto border dark:border-gray-700 rounded divide-y dark:divide-gray-700 text-sm dark:text-gray-200"></ul>
        <div class="text-right">
          <button id="btn-cerrar-modal" class="bg-gray-500 text-white px-4 py-1.5 rounded text-sm">Cerrar</button>
        </div>
      </div>
    </div>

    <!-- Panel de Gráficos (Oculto de inicio) -->
    <div id="panel-grafico" class="w-full bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md hidden">
      <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
        <h2 id="titulo-grafico" class="text-base font-semibold text-gray-700 dark:text-gray-200">Gráfico</h2>
        
        <div class="flex items-center gap-2">
          <label id="lbl-rango-grafico" class="text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase">Rango:</label>
          <select id="filtro-rango-grafico" class="border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1 text-xs">
            <option value="dia" data-i18n="rangoDia">Día actual</option>
            <option value="semana" data-i18n="rangoSemana">Esta semana</option>
            <option value="mes" data-i18n="rangoMes">Este mes</option>
            <option value="todo" selected data-i18n="rangoTodo">Todo el histórico</option>
          </select>
          <button id="btn-ocultar-grafico" class="text-xs bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 text-gray-600 dark:text-gray-300 px-2 py-1 rounded">✕</button>
        </div>
      </div>

      <div id="contenedor-resumen-bloques" class="mb-4 hidden">
        <h3 id="lbl-horas-bloque" class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-2">Horas por Bloque</h3>
        <div id="lista-resumen-bloques" class="flex flex-wrap gap-2"></div>
      </div>

      <div class="w-full max-w-lg mx-auto">
        <canvas id="myChart"></canvas>
      </div>
    </div>

    <!-- Tabla de Registros + Filtros y Totales -->
    <div class="w-full bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md">
      
      <div class="flex flex-wrap justify-between items-center mb-4 gap-3 bg-gray-50 dark:bg-gray-700/50 p-3 rounded-md border border-gray-200 dark:border-gray-700">
        <div>
          <h2 id="lbl-registros" class="text-base font-semibold text-gray-700 dark:text-gray-200">Registros</h2>
          <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
            <span id="lbl-total-jornada">Total filtrado:</span> <strong id="total-horas-jornada" class="text-blue-600 dark:text-blue-400 text-sm">00:00h</strong>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <div>
            <input type="date" id="filtro-fecha" class="border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1 text-xs">
          </div>
          <div>
            <select id="filtro-proyecto" class="border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1 text-xs">
              <option value="" data-i18n="todosProyectos">Todos los proyectos</option>
            </select>
          </div>
          <div>
            <select id="filtro-tarea" class="border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-1 text-xs">
              <option value="" data-i18n="todasTareas">Todas las tareas</option>
            </select>
          </div>
          <button id="btn-limpiar-filtros" class="text-xs bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 text-gray-700 dark:text-gray-200 px-2 py-1 rounded" data-i18n="limpiarFiltros">Limpiar</button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 border-b dark:border-gray-600">
              <th class="p-2" id="th-fecha">Fecha</th>
              <th class="p-2" id="th-tarea">Tarea</th>
              <th class="p-2" id="th-proyecto">Proyecto</th>
              <th class="p-2" id="th-bloque">Bloque</th>
              <th class="p-2" id="th-inicio">Inicio</th>
              <th class="p-2" id="th-fin">Fin</th>
              <th class="p-2" id="th-comentario">Comentario</th>
              <th class="p-2" id="th-notas">Notas</th>
              <th class="p-2" id="th-duracion">Duración</th>
              <th class="p-2 text-center" id="th-acciones">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-registros" class="divide-y dark:divide-gray-700"></tbody>
        </table>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
