<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGHOR - Registro de Tareas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="w-full min-h-full p-4 font-sans text-gray-800 box-border">
  <div class="w-full space-y-4">
    
    <!-- Encabezado con Menú de Navegación -->
    <div class="w-full flex justify-between items-center bg-white p-3 rounded-lg shadow-sm relative">
      <h1 class="text-xl font-bold text-gray-800">REGHOR - Registro de Horas y Tareas</h1>
      
      <!-- Menú Desplegable -->
      <div class="relative inline-block text-left">
        <button id="btn-menu-graficos" type="button" class="inline-flex justify-center w-full rounded-md border border-gray-300 shadow-sm px-3 py-1.5 bg-white text-xs font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
          📊 Gráficos ▾
        </button>

        <div id="dropdown-menu-graficos" class="hidden origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50">
          <div class="py-1" role="menu">
            <button id="opcion-por-proyecto" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-gray-100">Por proyecto</button>
            <button id="opcion-por-proyecto-bloque" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-gray-100">Por Proyecto-Bloque</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario de Entrada -->
    <div class="w-full bg-white p-4 rounded-lg shadow-md">
      <h2 class="text-base font-semibold mb-3 text-gray-700">Nueva Tarea</h2>
      
      <form id="task-form" class="w-full flex flex-wrap lg:flex-nowrap items-end gap-2" novalidate>
        
        <!-- 1. Fecha -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[130px]">
          <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Fecha</label>
          <input type="date" id="fecha" class="w-full border border-gray-300 rounded p-1.5 text-xs">
        </div>

        <!-- 2. Tarea -->
        <div class="w-full sm:w-auto sm:flex-[2] min-w-[160px]">
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-gray-600 uppercase">Tarea</label>
            <button type="button" id="btn-gestionar-tareas" class="text-[10px] text-blue-600 hover:underline">+ Config</button>
          </div>
          <select id="tarea" class="w-full border border-gray-300 rounded p-1.5 text-xs bg-white"></select>
        </div>

        <!-- 3. Proyecto -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[110px]">
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-gray-600 uppercase">Proyecto</label>
            <button type="button" id="btn-gestionar-proyectos" class="text-[10px] text-blue-600 hover:underline">+ Config</button>
          </div>
          <select id="proyecto" class="w-full border border-gray-300 rounded p-1.5 text-xs bg-white">
            <option value="BAC2" selected>BAC2</option>
          </select>
        </div>

        <!-- 4. Bloque -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[100px]">
          <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Bloque</label>
          <input type="text" id="bloque" placeholder="Bloque 1" class="w-full border border-gray-300 rounded p-1.5 text-xs">
        </div>

        <!-- 5. Hora Inicio -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[110px]">
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-gray-600 uppercase">H. Inicio</label>
            <button type="button" id="btn-usar-ultima-fin" class="text-[9px] bg-gray-200 hover:bg-gray-300 text-gray-700 px-1 rounded" title="Usar última hora fin">⬅ Copiar</button>
          </div>
          <input type="time" id="hora-inicio" class="w-full border border-gray-300 rounded p-1.5 text-xs">
        </div>

        <!-- 6. Hora Fin -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[110px]">
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-gray-600 uppercase">H. Fin</label>
            <button type="button" id="btn-hora-actual" class="text-[9px] bg-blue-100 hover:bg-blue-200 text-blue-700 px-1 rounded" title="Poner hora actual">⏱ Ahora</button>
          </div>
          <input type="time" id="hora-fin" class="w-full border border-gray-300 rounded p-1.5 text-xs">
        </div>

        <!-- 7. Comentario -->
        <div class="w-full sm:w-auto sm:flex-[3] min-w-[160px]">
          <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Comentario</label>
          <input type="text" id="comentario" placeholder="Explicación breve..." class="w-full border border-gray-300 rounded p-1.5 text-xs">
        </div>

        <!-- 8. Notas -->
        <div class="w-full sm:w-auto sm:flex-[2] min-w-[140px]">
          <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Notas</label>
          <input type="text" id="notas" placeholder="Anotaciones..." class="w-full border border-gray-300 rounded p-1.5 text-xs">
        </div>

        <!-- 9. Duración -->
        <div class="w-[48%] sm:w-auto sm:flex-1 min-w-[80px]">
          <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Duración</label>
          <input type="text" id="duracion" readonly placeholder="00:00" class="w-full bg-gray-100 border border-gray-300 rounded p-1.5 text-xs font-bold text-gray-700 text-center">
        </div>

        <!-- Botón Guardar -->
        <div class="w-full sm:w-auto sm:flex-1 min-w-[100px]">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-1.5 rounded text-xs transition-colors">
            + Guardar
          </button>
        </div>

      </form>
    </div>

    <!-- Modal Gestión (Proyectos y Tareas) -->
    <div id="modal-config" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-lg p-5 max-w-md w-full space-y-4">
        <h3 id="modal-titulo" class="text-lg font-bold">Gestionar Lista</h3>
        <div class="flex gap-2">
          <input type="text" id="nuevo-item-input" placeholder="Añadir nuevo..." class="border p-2 rounded text-sm flex-1">
          <button id="btn-add-item" class="bg-green-600 text-white px-3 py-1 rounded text-sm font-semibold">+ Añadir</button>
        </div>
        <ul id="lista-gestor" class="max-h-48 overflow-y-auto border rounded divide-y text-sm"></ul>
        <div class="text-right">
          <button id="btn-cerrar-modal" class="bg-gray-500 text-white px-4 py-1.5 rounded text-sm">Cerrar</button>
        </div>
      </div>
    </div>

    <!-- Panel de Gráficos (Oculto de inicio) -->
    <div id="panel-grafico" class="w-full bg-white p-4 rounded-lg shadow-md hidden">
      <div class="flex justify-between items-center mb-3">
        <h2 id="titulo-grafico" class="text-base font-semibold text-gray-700">Gráfico</h2>
        <button id="btn-ocultar-grafico" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-600 px-2 py-1 rounded">Cerrar vista</button>
      </div>

      <!-- Resumen de Horas por Bloques (Visible solo en vista 'Por proyecto') -->
      <div id="contenedor-resumen-bloques" class="mb-4 hidden">
        <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Horas por Bloque</h3>
        <div id="lista-resumen-bloques" class="flex flex-wrap gap-2"></div>
      </div>

      <div class="w-full max-w-sm mx-auto">
        <canvas id="myChart"></canvas>
      </div>
    </div>

    <!-- Tabla de Registros del Día -->
    <div class="w-full bg-white p-4 rounded-lg shadow-md overflow-x-auto">
      <h2 class="text-base font-semibold mb-3 text-gray-700">Registros de Hoy</h2>
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr class="bg-gray-100 text-gray-600 border-b">
            <th class="p-2">Fecha</th>
            <th class="p-2">Tarea</th>
            <th class="p-2">Proyecto</th>
            <th class="p-2">Bloque</th>
            <th class="p-2">Inicio</th>
            <th class="p-2">Fin</th>
            <th class="p-2">Comentario</th>
            <th class="p-2">Notas</th>
            <th class="p-2">Duración</th>
          </tr>
        </thead>
        <tbody id="tabla-registros" class="divide-y"></tbody>
      </table>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
